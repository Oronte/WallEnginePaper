<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Constellation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060f; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
// Fond web d'exemple pour WallEnginePaper.
// API : window.wallEnginePaper.{mouse, audio, audioLevel, params, paused, on(type, callback)}
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const wep = window.wallEnginePaper || { mouse: { x: 0, y: 0, inside: false }, audioLevel: 0, params: {}, paused: false, on() {} };

  const settings = { count: 220, linkDistance: 140, speed: 1, color: [0.55, 0.42, 1.0], attract: true };
  let stars = [];
  let width = 0, height = 0, dpr = 1;

  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const spawn = () => ({
    x: Math.random() * width, y: Math.random() * height,
    vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
    r: 0.6 + Math.random() * 1.6, twinkle: Math.random() * Math.PI * 2,
  });
  const syncCount = () => {
    const target = Math.round(settings.count);
    while (stars.length < target) stars.push(spawn());
    stars.length = target;
  };
  const rgb = (alpha) => {
    const [r, g, b] = settings.color;
    return `rgba(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)}, ${alpha})`;
  };

  wep.on('params', (p) => { Object.assign(settings, p); syncCount(); });
  window.addEventListener('resize', () => { resize(); });
  resize(); syncCount();

  let last = performance.now();
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000) * 60; last = now;
    requestAnimationFrame(frame);
    if (wep.paused) return;

    const pulse = 1 + Math.min(1, wep.audioLevel || 0) * 0.8;
    ctx.fillStyle = 'rgba(7, 6, 15, 0.35)';
    ctx.fillRect(0, 0, width, height);

    const mx = wep.mouse.x, my = wep.mouse.y, mouseActive = wep.mouse.inside;
    for (const s of stars) {
      if (settings.attract && mouseActive) {
        const dx = mx - s.x, dy = my - s.y, d2 = dx * dx + dy * dy;
        if (d2 < 220 * 220 && d2 > 1) { const f = 0.012 / Math.sqrt(d2); s.vx += dx * f; s.vy += dy * f; }
      }
      s.vx *= 0.995; s.vy *= 0.995;
      s.x += s.vx * settings.speed * dt; s.y += s.vy * settings.speed * dt;
      if (s.x < -10) s.x = width + 10; else if (s.x > width + 10) s.x = -10;
      if (s.y < -10) s.y = height + 10; else if (s.y > height + 10) s.y = -10;
      s.twinkle += 0.03 * dt;
    }

    const maxD = settings.linkDistance, maxD2 = maxD * maxD;
    ctx.lineWidth = 0.8;
    for (let i = 0; i < stars.length; i++) {
      const a = stars[i];
      for (let j = i + 1; j < stars.length; j++) {
        const b = stars[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < maxD2) {
          ctx.strokeStyle = rgb((1 - Math.sqrt(d2) / maxD) * 0.35 * pulse);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const s of stars) {
      const glow = 0.6 + 0.4 * Math.sin(s.twinkle);
      ctx.fillStyle = rgb(0.5 + 0.5 * glow);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * pulse, 0, Math.PI * 2); ctx.fill();
    }
    if (mouseActive) {
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, 160);
      g.addColorStop(0, rgb(0.18)); g.addColorStop(1, rgb(0));
      ctx.fillStyle = g; ctx.fillRect(mx - 160, my - 160, 320, 320);
    }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
